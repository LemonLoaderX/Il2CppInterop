name: .NET

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    # Prevent running workflow twice on a PR from a non-fork
    # We could use Skip Duplicate Actions, but this is shorter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "Invalid release version: $release" >&2
              exit 1
            fi
            echo "version=${release%%-*}" >> "$GITHUB_OUTPUT"
            if [[ "$release" == *-* ]]; then
              echo "build_tag=${release#*-}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build_tag=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.get_version.outputs.version }}
          BUILD_TAG: ${{ steps.get_version.outputs.build_tag }}
        run: |
          args=(--target=Pack)
          if [[ -n "$BUILD_VERSION" ]]; then args+=("--build_version=$BUILD_VERSION"); fi
          if [[ -n "$BUILD_TAG" ]]; then args+=("--build_tag=$BUILD_TAG"); fi
          ./build.sh "${args[@]}"

      - name: Hash release assets
        run: |
          cd bin/zip
          sha256sum *.zip > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./bin/zip/*
          name: Il2CppInterop

      - name: Push to NuGet
        if: github.repository == 'BepInEx/Il2CppInterop' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            push_source="https://api.nuget.org/v3/index.json"
            push_api_key="${{ secrets.NUGET_ORG_KEY }}"
          else
            push_source="${{ secrets.BEPIN_DEV_NUGET_SOURCE }}"
            push_api_key="${{ secrets.BEPIN_DEV_NUGET_KEY }}"
          fi
          dotnet nuget push --skip-duplicate -s "$push_source" -k "$push_api_key" ./bin/NuGet/*.nupkg

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          prerelease: ${{ contains(steps.get_version.outputs.build_tag, 'lemon') }}
          fail_on_unmatched_files: true
          files: |
            ./bin/zip/*.zip
            ./bin/zip/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
